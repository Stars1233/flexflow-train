namespace = "FlexFlow"
name = "V1KwargDataflowGraph"
type = "struct"
features = [
  "eq",
  # "ord",
  "hash",
  "json",
  # "rapidcheck",
  "fmt",
]

template_params = [
  "SlotName",
]

includes = [
  "<vector>",
  "<set>",
  "pcg/file_format/v1/graphs/v1_kwarg_graph_edge.dtg.h",
  "pcg/file_format/v1/graphs/v1_kwarg_graph_output.dtg.h",
  "utils/nonnegative_int/nonnegative_int.h",
]

src_includes = [
  "utils/fmt/vector.h",
  "utils/hash/vector.h",
  "utils/fmt/set.h",
  "utils/hash/set.h",
]

[[fields]]
name = "nodes"
type = "std::vector<::FlexFlow::nonnegative_int>"

[[fields]]
name = "edges"
type = "std::set<::FlexFlow::V1KwargGraphEdge<SlotName>>"

[[fields]]
name = "outputs"
type = "std::set<::FlexFlow::V1KwargGraphOutput<SlotName>>"
