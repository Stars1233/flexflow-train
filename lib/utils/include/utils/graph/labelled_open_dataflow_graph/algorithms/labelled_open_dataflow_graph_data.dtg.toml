namespace = "FlexFlow"
name = "LabelledOpenDataflowGraphData"
type = "struct"
features = [
  "eq",
  "hash",
  "fmt",
]

template_params = ["NodeLabel", "ValueLabel"]

includes = [
  "utils/graph/node/node.dtg.h",
  "utils/graph/open_dataflow_graph/open_dataflow_edge.dtg.h",
  "utils/graph/open_dataflow_graph/dataflow_graph_input.dtg.h",
  "utils/graph/open_dataflow_graph/open_dataflow_value.dtg.h",
  "<map>",
  "<set>",
]

src_includes = [
  "utils/hash/map.h",
  "utils/hash/set.h",
  "utils/fmt/map.h",
  "utils/fmt/set.h",
]

[[fields]]
name = "node_data"
type = "std::map<::FlexFlow::Node, NodeLabel>"

[[fields]]
name = "edges"
type = "std::set<::FlexFlow::OpenDataflowEdge>"

[[fields]]
name = "inputs"
type = "std::set<::FlexFlow::DataflowGraphInput>"

[[fields]]
name = "value_data"
type = "std::map<::FlexFlow::OpenDataflowValue, ValueLabel>"
