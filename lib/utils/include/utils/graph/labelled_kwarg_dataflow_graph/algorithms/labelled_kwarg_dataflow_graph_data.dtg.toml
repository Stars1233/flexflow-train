namespace = "FlexFlow"
name = "LabelledKwargDataflowGraphData"
type = "struct"
features = [
  "eq",
  "hash",
  "fmt",
]

template_params = [
  "NodeLabel",
  "ValueLabel",
  "SlotName",
]

includes = [
  "utils/graph/node/node.dtg.h",
  "utils/graph/kwarg_dataflow_graph/kwarg_dataflow_edge.dtg.h",
  "utils/graph/kwarg_dataflow_graph/kwarg_dataflow_output.dtg.h",
  "<map>",
  "<set>",
]

src_includes = [
  "utils/hash/map.h",
  "utils/hash/set.h",
  "utils/fmt/map.h",
  "utils/fmt/set.h",
]

[[fields]]
name = "node_data"
type = "std::map<::FlexFlow::Node, NodeLabel>"

[[fields]]
name = "edges"
type = "std::set<::FlexFlow::KwargDataflowEdge<SlotName>>"

[[fields]]
name = "output_data"
type = "std::map<::FlexFlow::KwargDataflowOutput<SlotName>, ValueLabel>"
