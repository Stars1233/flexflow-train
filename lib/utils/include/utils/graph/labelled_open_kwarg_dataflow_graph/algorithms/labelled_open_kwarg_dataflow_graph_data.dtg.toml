namespace = "FlexFlow"
name = "LabelledOpenKwargDataflowGraphData"
type = "struct"
features = [
  "eq",
  "hash",
  "fmt",
  "json_serialize",
]

template_params = [
  "NodeLabel",
  "ValueLabel",
  "GraphInputName",
  "SlotName",
]

includes = [
  "utils/graph/node/node.dtg.h",
  "utils/graph/open_kwarg_dataflow_graph/open_kwarg_dataflow_edge.dtg.h",
  "utils/graph/open_kwarg_dataflow_graph/kwarg_dataflow_graph_input.dtg.h",
  "utils/graph/open_kwarg_dataflow_graph/open_kwarg_dataflow_value.dtg.h",
  "<map>",
  "<set>",
]

src_includes = [
  "utils/hash/map.h",
  "utils/hash/set.h",
  "utils/fmt/map.h",
  "utils/fmt/set.h",
]

[[fields]]
name = "node_data"
type = "std::map<::FlexFlow::Node, NodeLabel>"

[[fields]]
name = "edges"
type = "std::set<::FlexFlow::OpenKwargDataflowEdge<GraphInputName, SlotName>>"

[[fields]]
name = "inputs"
type = "std::set<::FlexFlow::KwargDataflowGraphInput<GraphInputName>>"

[[fields]]
name = "value_data"
type = "std::map<::FlexFlow::OpenKwargDataflowValue<GraphInputName, SlotName>, ValueLabel>"
