namespace = "FlexFlow"
name = "OpenDataflowGraphData"
type = "struct"
features = [
  "eq",
  "hash",
  "fmt",
]

includes = [
  "utils/graph/node/node.dtg.h",
  "utils/graph/open_dataflow_graph/open_dataflow_edge.dtg.h",
  "utils/graph/open_dataflow_graph/dataflow_graph_input.dtg.h",
  "utils/graph/dataflow_graph/dataflow_output.dtg.h",
  "<set>",
]

src_includes = [
  "utils/hash/set.h",
  "utils/fmt/set.h",
]

[[fields]]
name = "nodes"
type = "std::set<::FlexFlow::Node>"

[[fields]]
name = "edges"
type = "std::set<::FlexFlow::OpenDataflowEdge>"

[[fields]]
name = "inputs"
type = "std::set<::FlexFlow::DataflowGraphInput>"

[[fields]]
name = "outputs"
type = "std::set<::FlexFlow::DataflowOutput>"
