namespace = "FlexFlow"
name = "CLIPositionalArgumentSpec"
type = "struct"
features = [
  "eq",
  "ord",
  "hash",
  "fmt",
  "json_serialize",
]

includes = [
  "<optional>",
  "<set>",
  "<string>",
]

src_includes = [
  "utils/fmt/optional.h",
  "utils/fmt/vector.h",
  "utils/hash/vector.h",
  "utils/json/optional.h",
]

[[fields]]
name = "name"
type = "std::string"

[[fields]]
name = "choices"
type = "std::optional<std::vector<std::string>>"

[[fields]]
name = "description"
type = "std::optional<std::string>"
